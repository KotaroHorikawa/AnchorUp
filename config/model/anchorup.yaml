_target_: src.model.anchorup.AnchorUp
name: anchorup

dim: 128
heads_attn: 4
heads_rope: 4
kernel_size: 9
use_encoder: true
img_layers: 2

# Residual anchor: bilinear | bicubic. The paper checkpoint is bilinear.
base_mode: bilinear

# Raw gate parameter gamma. alpha = sigmoid(gamma), initialized at 0.
gate_params: 0.0

rope_base: 100.0
rope_rescale: 2.0
