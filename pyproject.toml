[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "anchorup"
version = "0.1.0"
description = "AnchorUp: anchoring feature upsampling on a classical interpolation"
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "utils*", "evaluation*", "analysis*", "hydra_plugins*"]
